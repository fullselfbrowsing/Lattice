# Lattice PR-Time CI Workflow
# The primary job runs deterministic workspace gates on Node 24. Packed
# consumers run separately on every supported Node line so package exports are
# exercised exactly as downstream applications load them.
# Third-party actions are pinned to full commit SHAs. Root permissions are
# read-only, and this workflow has no OIDC capability or secrets references.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        # Required before typecheck so workspace packages (lattice-cli) can
        # resolve types from the runtime's published exports (./dist/index.d.ts).
        # Without this, tsc cannot find @full-self-browsing/lattice from cli source.
        run: pnpm -r build

      - name: Type-check workspace
        run: pnpm -r typecheck

      - name: Run unit tests
        run: pnpm -r test

      - name: Validate package types (tsd)
        run: pnpm -r test:types

      - name: Lint packages (publint + attw)
        run: pnpm -r lint:packages

      - name: Audit tarballs for stale names
        run: node scripts/check-tarball-leak.mjs

      - name: Audit package version surfaces
        run: node scripts/check-package-version-surfaces.mjs

      - name: Audit core package boundary
        run: node scripts/check-core-package-boundary.mjs

      - name: Audit source imports for stale rename
        run: node scripts/verify-rename.mjs

      - name: Audit workflows for OIDC and PR-target drift
        run: node scripts/check-workflow-safety.mjs

      - name: Validate production comment hygiene
        run: pnpm check:comment-hygiene

  packed-consumer:
    name: packed-consumer-node-${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packed runtime and CLI consumer
        run: pnpm check:packed-consumer

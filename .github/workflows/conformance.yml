name: conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "spec/**"
      - "conformance/**"
      - "clients/python/**"
      - "packages/lattice/src/receipts/**"
      - "packages/lattice/src/storage/fingerprint.ts"
      - ".github/workflows/conformance.yml"
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "conformance/**"
      - "clients/python/**"
      - "packages/lattice/src/receipts/**"
      - "packages/lattice/src/storage/fingerprint.ts"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python client
        run: python -m pip install -e "clients/python[test]"

      - name: Verify vector manifest
        run: cd conformance/vectors && sha256sum --check MANIFEST.sha256

      - name: Run TypeScript receipt conformance harness
        run: pnpm --filter @lattice-conformance/verify-ts test

      - name: Run Python receipt conformance harness
        run: python -m pytest clients/python/tests -q

      - name: Run cross-mint parity
        env:
          LATTICE_RUN_CROSS_MINT: "1"
          PYTHON: python
        run: pnpm --filter @lattice-conformance/verify-ts test -- src/cross_mint_parity.test.ts

